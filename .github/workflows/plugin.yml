name: Plugin package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [created]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Extract and validate release version
        if: github.event_name == 'release'
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH (for example v1.0.7)"
            exit 1
          fi
          echo "number=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and validate plugin
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            python scripts/build_plugin.py --version "$RELEASE_VERSION"
          else
            python scripts/build_plugin.py
          fi
      - name: Upload workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: no-ai-slop-plugin
          path: dist/no-ai-slop-plugin-*.zip
      - name: Upload ZIP to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/no-ai-slop-plugin-*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
